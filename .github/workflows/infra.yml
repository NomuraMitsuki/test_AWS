name: Infra Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  # job-level if では secrets コンテキストが使えないため、有無を output で渡す。
  # 手順: infra/bootstrap apply → backend.hcl に実名を書いてコミット → 本体 apply → Secrets。
  plan-gate:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      can_plan: ${{ steps.check.outputs.can_plan }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN_INFRA: ${{ secrets.AWS_ROLE_ARN_INFRA }}
        run: |
          if [ -n "${AWS_ROLE_ARN_INFRA}" ]; then
            echo "can_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_plan=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: plan-gate
    if: needs.plan-gate.outputs.can_plan == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_INFRA }}
          aws-region: ap-northeast-1
      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Terraform plan
        run: terraform plan -input=false -no-color

  plan-skip-note:
    needs: plan-gate
    if: needs.plan-gate.outputs.can_plan == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Note when infra plan credentials missing
        run: |
          echo "terraform plan は secrets.AWS_ROLE_ARN_INFRA が未設定のためスキップしました。"
          echo "validate までは必須ゲートです。OIDC と remote backend の手順は W-109 を参照。"

  apply-gate:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      can_apply: ${{ steps.check.outputs.can_apply }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN_INFRA: ${{ secrets.AWS_ROLE_ARN_INFRA }}
        run: |
          if [ -n "${AWS_ROLE_ARN_INFRA}" ]; then
            echo "can_apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_apply=false" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: apply-gate
    if: needs.apply-gate.outputs.can_apply == 'true'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_INFRA }}
          aws-region: ap-northeast-1
      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Terraform apply
        # environment: dev の reviewers 承認後に実行。Secret 設定後の失敗はジョブ失敗とする。
        run: terraform apply -input=false -auto-approve tfplan

  apply-skip-note:
    needs: apply-gate
    if: needs.apply-gate.outputs.can_apply == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Note when infra apply credentials missing
        run: |
          echo "terraform apply は secrets.AWS_ROLE_ARN_INFRA が未設定のためスキップしました。"
          echo "validate までは必須ゲートです。手順は W-109（bootstrap → backend.hcl → 本体 apply → Secrets）。"
